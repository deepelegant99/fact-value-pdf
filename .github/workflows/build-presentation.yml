name: Build Putnam presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-presentation.yml'
      - 'scripts/build_presentation.js'
      - 'Content/putnam-fact-value-slides.md'
      - 'Template/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install presentation tools
        run: |
          npm install pptxgenjs
          python -m pip install --upgrade pip
          pip install python-pptx pillow
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-liberation

      - name: Build PowerPoint
        run: node scripts/build_presentation.js

      - name: Convert PowerPoint to PDF
        run: |
          soffice --headless --convert-to pdf --outdir Presentation Presentation/Putnam_Fact_Value_Entanglement_YouTube_Deck.pptx

      - name: Quality checks
        run: |
          python - <<'PY'
          from pptx import Presentation
          p='Presentation/Putnam_Fact_Value_Entanglement_YouTube_Deck.pptx'
          prs=Presentation(p)
          assert len(prs.slides) == 19, len(prs.slides)
          for i, slide in enumerate(prs.slides, start=1):
              text=' '.join(sh.text for sh in slide.shapes if getattr(sh,'has_text_frame',False)).strip()
              assert text, f'slide {i} is empty'
          print('PPTX QA OK:', len(prs.slides), 'slides')
          PY
          pages=$(pdfinfo Presentation/Putnam_Fact_Value_Entanglement_YouTube_Deck.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" -eq 19
          echo "PDF QA OK: $pages pages"

      - name: Render preview pages
        run: |
          mkdir -p build-preview
          pdftoppm -png -r 72 -f 1 -l 19 Presentation/Putnam_Fact_Value_Entanglement_YouTube_Deck.pdf build-preview/slide >/dev/null 2>&1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: putnam-youtube-deck
          path: |
            Presentation/Putnam_Fact_Value_Entanglement_YouTube_Deck.pptx
            Presentation/Putnam_Fact_Value_Entanglement_YouTube_Deck.pdf
            build-preview/*.png
          retention-days: 7

      - name: Commit generated presentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f Presentation/putnam-fact-value-slides.pptx Presentation/putnam-fact-value-slides.pdf
          git add -A Presentation
          if ! git diff --cached --quiet; then
            git commit -m 'Build 19-slide Putnam YouTube presentation'
            git push
          fi
